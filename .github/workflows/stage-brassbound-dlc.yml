name: Stage the licensed Brassbound DLC

on:
  push:
    branches: ['codex/stage-brassbound-itch-upload']

permissions:
  contents: read

jobs:
  upload:
    if: github.event.created
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Prepare a one-time upload certificate
        run: |
          openssl req -new -x509 -newkey rsa:3072 -nodes -days 1 \
            -subj '/CN=Brassbound DLC one-time transfer' \
            -keyout "$RUNNER_TEMP/brassbound-key.pem" -out "$RUNNER_TEMP/brassbound-cert.pem" 2>/dev/null
          printf 'BRASSBOUND_UPLOAD_CERTIFICATE='
          base64 -w 0 "$RUNNER_TEMP/brassbound-cert.pem"
          printf '\n'
      - uses: actions/upload-artifact@v4
        with:
          name: brassbound-upload-public-certificate
          path: ${{ runner.temp }}/brassbound-cert.pem
          retention-days: 1
          if-no-files-found: error
      - name: Receive and check the licensed archive
        run: |
          work="$RUNNER_TEMP/brassbound-upload"
          install -d -m 700 "$work"
          for attempt in {1..54}; do
            git fetch --no-tags --depth=1 --quiet origin refs/heads/codex/stage-brassbound-itch-upload
            if git show FETCH_HEAD:brassbound-dlc.cms > "$RUNNER_TEMP/brassbound-dlc.cms" 2>/dev/null; then break; fi
            sleep 5
          done
          test -s "$RUNNER_TEMP/brassbound-dlc.cms"
          openssl cms -decrypt -binary -inform DER -in "$RUNNER_TEMP/brassbound-dlc.cms" \
            -inkey "$RUNNER_TEMP/brassbound-key.pem" -out "$work/Brassbound-Motor-Car.zip"
          rm -- "$RUNNER_TEMP/brassbound-key.pem" "$RUNNER_TEMP/brassbound-dlc.cms"
          printf '%s  %s\n' f63d3222a267b5d6d3a62234ab95516b7495fa387fc50417836caa5e9d288dd8 "$work/Brassbound-Motor-Car.zip" | sha256sum --check
          unzip -tq "$work/Brassbound-Motor-Car.zip"
      - name: Upload to the paid listing with the file hidden
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const url = 'https://digitaldro.itch.io/seventy-steps-the-brassbound-motor-car';
          const key = process.env.BUTLER_API_KEY;
          if (!key) throw Error('No Butler credential configured');
          const res = await fetch('https://api.itch.io/profile/games', { headers: { Authorization: `Bearer ${key}` } });
          if (!res.ok) throw Error(`itch.io returned HTTP ${res.status}`);
          const { games } = await res.json();
          const car = games.find(game => game.id === 5440073 && game.url === url);
          if (car?.min_price !== 100) throw Error('The expected $1 car listing could not be verified');
          JS
          curl --fail --silent --show-error --location https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/brassbound-butler.zip"
          unzip -q "$RUNNER_TEMP/brassbound-butler.zip" -d "$RUNNER_TEMP/brassbound-butler"
          chmod +x "$RUNNER_TEMP/brassbound-butler/butler"
          target=digitaldro/seventy-steps-the-brassbound-motor-car
          "$RUNNER_TEMP/brassbound-butler/butler" push "$RUNNER_TEMP/brassbound-upload" "$target:brassbound-motor-car-dlc" --hidden --no-auto-unzip
          "$RUNNER_TEMP/brassbound-butler/butler" status "$target"
      - name: Remove the temporary archive and transfer key
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/brassbound-key.pem" "$RUNNER_TEMP/brassbound-dlc.cms" "$RUNNER_TEMP/brassbound-upload/Brassbound-Motor-Car.zip"

  verify:
    if: github.event.head_commit.message == 'Verify the staged itch DLC download'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check the processed DLC channel
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          curl --fail --silent --show-error --location https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/brassbound-butler.zip"
          unzip -q "$RUNNER_TEMP/brassbound-butler.zip" -d "$RUNNER_TEMP/brassbound-butler"
          chmod +x "$RUNNER_TEMP/brassbound-butler/butler"
          "$RUNNER_TEMP/brassbound-butler/butler" status --json digitaldro/seventy-steps-the-brassbound-motor-car:brassbound-motor-car-dlc
      - name: Check the owner can see the upload
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { rm, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const headers = { Authorization: `Bearer ${process.env.BUTLER_API_KEY}` };
          const res = await fetch('https://api.itch.io/games/5440073/uploads', { headers });
          if (!res.ok) {
            console.log(`Owner upload listing returned HTTP ${res.status}.`);
          } else {
            const { uploads } = await res.json();
            const upload = Object.values(uploads ?? {}).find(upload => upload?.id === 20806248);
            if (upload) {
              const { id, filename, display_name, hidden, size, build } = upload;
              console.log(JSON.stringify({ id, filename, display_name, hidden, size, buildId: build?.id }));
            } else {
              console.log('The owner upload response did not list the hidden upload by ID.');
            }
          }
          const download = await fetch('https://api.itch.io/uploads/20806248/download', { headers });
          if (!download.ok) {
            console.log(`Owner download returned HTTP ${download.status}.`);
          } else {
            let file = download;
            if (download.headers.get('content-type')?.includes('application/json')) {
              const { url } = await download.json();
              if (typeof url !== 'string' || new URL(url).protocol !== 'https:') {
                console.log('Owner download response did not contain a direct link.');
                process.exit(0);
              }
              file = await fetch(url);
            }
            if (!file.ok) throw Error(`Download returned HTTP ${file.status}`);
            const body = Buffer.from(await file.arrayBuffer());
            const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
            const expected = 'f63d3222a267b5d6d3a62234ab95516b7495fa387fc50417836caa5e9d288dd8';
            if (sha256(body) === expected) {
              console.log('Owner download matches the original licensed archive byte for byte.');
            } else if (body.subarray(0, 2).toString() === 'PK') {
              const archive = join(process.env.RUNNER_TEMP, 'brassbound-owner-download.zip');
              await writeFile(archive, body, { mode: 0o600 });
              try {
                const list = execFileSync('unzip', ['-Z1', archive], { encoding: 'utf8' }).trim().split('\n');
                if (list.length !== 1 || list[0] !== 'Brassbound-Motor-Car.zip') throw Error('The download ZIP did not contain the expected one-file wrapper.');
                const inner = execFileSync('unzip', ['-p', archive, 'Brassbound-Motor-Car.zip']);
                if (sha256(inner) !== expected) throw Error('The wrapped archive did not match the original.');
                console.log('The itch download wraps Brassbound-Motor-Car.zip. The archive inside matches the original byte for byte.');
              } finally {
                await rm(archive, { force: true });
              }
            } else {
              throw Error(`Unexpected download type ${file.headers.get('content-type')} (${body.length} bytes).`);
            }
          }
          JS
