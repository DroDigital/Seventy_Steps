name: Creature integration checks

on:
  pull_request:
  push:
    branches: [main, codex/integrate-reviewed-creature-art]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creature-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # check:all includes the full audit suite, which can exceed 15 minutes on CI
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:all
      - run: npm run build
