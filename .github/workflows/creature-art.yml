name: Creature integration checks

on:
  pull_request:
  push:
    branches: [main, codex/integrate-reviewed-creature-art]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creature-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # PR 219 explicitly defers the boss-balance audit while the stamina rules change.
      - name: Check without boss-balance audit (PR 219)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 219
        run: npm run check:all -- --exclude tests/balance.test.ts
      - name: Check all tests
        if: github.event_name != 'pull_request' || github.event.pull_request.number != 219
        run: npm run check:all
      - run: npm run build
