name: Release builds

# The game packed for Steam, on a machine of each platform (the controllers' SDL library is downloaded for the machine it is installed on:
# docs/STEAM.md), and started once (`--smoke-test`: it must reach its title, find the Steam binding and start the controllers' worker).
# Runs when the shell or the packaging changes, by hand, and on a tag (v*). The depots are the artifacts; uploading them is docs/RELEASE.md.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packaging/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/package_mac.mjs'
      - 'tools/smoke_packaged.mjs'
      - 'tools/steam_upload.mjs'
      - '.github/workflows/release-builds.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Starts, and reaches its title
        run: node tools/smoke_packaged.mjs
      - name: Zip the depot
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked -DestinationPath seventy-steps-windows.zip -CompressionLevel Fastest
      - uses: actions/upload-artifact@v4
        with:
          name: seventy-steps-windows
          path: seventy-steps-windows.zip
          retention-days: 7
          compression-level: 0

  mac:
    runs-on: macos-latest # Apple Silicon: the Intel build is made on it too (package_mac.mjs fetches that architecture's SDL)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:mac
      - name: Starts, and reaches its title (Apple Silicon)
        run: node tools/smoke_packaged.mjs --app "release/mac-arm64/Seventy Steps.app/Contents/MacOS/Seventy Steps"
      - name: Starts under Rosetta (Intel)
        continue-on-error: true
        run: |
          arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true
          node tools/smoke_packaged.mjs --arch x86_64 --verbose --timeout 600 --app "release/mac/Seventy Steps.app/Contents/MacOS/Seventy Steps"
      - name: One app for both
        continue-on-error: true
        run: node tools/package_mac.mjs --universal --no-build
      - name: Universal app starts
        continue-on-error: true
        run: node tools/smoke_packaged.mjs --verbose --timeout 90 --app "release/mac-universal/Seventy Steps.app/Contents/MacOS/Seventy Steps"
      - name: Why the universal app does not start (a copy, its stub made to say what it throws)
        if: always()
        continue-on-error: true
        run: |
          set -x
          ROOT="$PWD"; D=/tmp/diag; rm -rf "$D"; mkdir -p "$D"
          [ -d "release/mac-universal/Seventy Steps.app" ] || exit 0
          ditto "release/mac-universal/Seventy Steps.app" "$D/Seventy Steps.app"
          R="$D/Seventy Steps.app/Contents/Resources"
          ls -la "$R" | head -12
          cat "$R/app-arm64/package.json" | head -12
          node "$ROOT/node_modules/@electron/asar/bin/asar.js" extract "$R/app.asar" "$D/stub"
          ls -la "$D/stub"; cat "$D/stub/package.json"
          node -e "const fs=require('fs');const f='$D/stub/index.js';let s=fs.readFileSync(f,'utf8');s=s.replace('require(process._archPath);','try{require(process._archPath);}catch(e){console.error(\'STUB FAIL\',e&&e.stack||e);process.exit(3);}');fs.writeFileSync(f,s)"
          node "$ROOT/node_modules/@electron/asar/bin/asar.js" pack "$D/stub" "$R/app.asar"
          codesign --force --deep --sign - "$D/Seventy Steps.app"
          node tools/smoke_packaged.mjs --verbose --timeout 60 --app "$D/Seventy Steps.app/Contents/MacOS/Seventy Steps"
      - name: What the Mac apps are (for the log)
        if: always()
        continue-on-error: true
        run: |
          for d in mac-arm64 mac mac-universal; do
            app="release/$d/Seventy Steps.app"
            [ -d "$app" ] || continue
            echo "== $d"; lipo -info "$app/Contents/MacOS/Seventy Steps"; codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|flags|Format' || true
            ls "$app/Contents/Resources" | head -20
          done
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
      - name: Zip the depots (ditto keeps the bundle's links and permissions)
        run: |
          for d in mac-arm64 mac mac-universal; do
            [ -d "release/$d/Seventy Steps.app" ] && ditto -c -k --sequesterRsrc --keepParent "release/$d/Seventy Steps.app" "seventy-steps-$d.zip" || true
          done
          ls -la *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: seventy-steps-mac
          path: seventy-steps-*.zip
          retention-days: 7
          compression-level: 0

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run package:linux
      - name: Starts, and reaches its title
        env:
          SMOKE_SOFTWARE_GL: '1' # no GPU here
        run: xvfb-run -a -s "-screen 0 1280x720x24" node tools/smoke_packaged.mjs
      - name: Pack the depot (tar keeps the executable bit)
        run: tar -czf seventy-steps-linux.tar.gz -C release linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: seventy-steps-linux
          path: seventy-steps-linux.tar.gz
          retention-days: 7
          compression-level: 0
